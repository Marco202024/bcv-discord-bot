name: Publicar Tasa BCV por Fecha
on:
  schedule:
    # Corre todos los días a las 04:00 UTC (00:00 Venezuela)
    - cron: '12 4 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar bot
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_WEBHOOK_2: ${{ secrets.DISCORD_WEBHOOK_2 }}
        run: python bot.py

      - name: Guardar cambio de historial en el repo
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          if [ -f historial_tasas.dat ]; then
            git add historial_tasas.dat
            git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar historial de tasas .dat [Bot]" && git push)
          fi
